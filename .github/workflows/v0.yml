name: v0

# The v0 TypeScript prototype, Phases 1-5. Deliberately a separate workflow from
# `corpus`: one gates the specification, the other gates the implementation, and
# a failure in either should be readable without untangling the other.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: v0

jobs:
  v0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installed before setup-node because the install step needs it. The
      # version comes from the pinned `packageManager` field rather than being
      # repeated here, so there is one place to change it.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: v0/package.json

      # No dependency cache. setup-node's pnpm cache resolves the store from the
      # repository root, where there is no pnpm project - `defaults.run` applies
      # to `run:` steps, not to actions - and it failed there. The install is
      # four dev dependencies, so the cache bought less than the failure cost.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: environment
        run: |
          {
            echo '### v0 environment'
            echo '```'
            echo "node    $(node --version)"
            echo "pnpm    $(pnpm --version)"
            echo "cwd     $(pwd)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The install output is mirrored into the step summary because job logs
      # are not readable without a token, and a failure nobody can read costs
      # more than the six lines that make it readable.
      - name: install
        run: |
          set -o pipefail
          if ! pnpm install --frozen-lockfile 2>&1 | tee /tmp/install.log; then
            {
              echo '### pnpm install failed'
              echo '```'
              tail -80 /tmp/install.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: typecheck
        run: pnpm typecheck

      # `coverage` runs the suite and enforces the floor from
      # .kiro/steering/testing.md in one pass. Running `test` separately would
      # execute every test twice and leave the floor unenforced, which is how a
      # configured threshold quietly becomes decorative.
      - name: test and coverage floor
        run: pnpm coverage
